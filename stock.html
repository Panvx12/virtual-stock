<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./icon.webp">
    <title>鬆餅股市行情與文章專區</title>
    <link rel="stylesheet" href="basic_style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- 上方：股市行情卡片 -->
    <div class="stock-card">
        <div class="card-header">
            <div>
                <h1>鬆餅股市行情 <span class="stock-code">(代號: 8271)</span></h1>
                <p id="index-status" class="status-text">Connecting to cloud database...</p>
            </div>
            
            <div class="header-right">
                <div class="user-bar">
                    <span id="user-info" style="display: none;"></span>
                    <button id="auth-action-btn" class="btn-primary">Login</button>
                </div>

                <div class="price-info">
                    <div id="current-price" class="current-price text-green">10.00</div>
                    <div id="price-change" class="price-change text-green">+0.00 (+0.00%)</div>
                </div>
            </div>
        </div>
        
        <div id="chart-container"></div>

        <!-- 交易面板 -->
        <div id="trading-panel" class="trading-panel" style="display: none;">
            <div class="wallet-info">
                <span>Cash: <strong id="user-cash">100,000.00</strong> TWD</span>
                <span>Holdings: <strong id="user-shares">0</strong> Shares</span>
            </div>
            <div class="trade-controls">
                <input type="number" id="trade-qty" min="1" value="1000" placeholder="Shares" />
                <button id="btn-buy" class="btn-buy">Buy</button>
                <button id="btn-sell" class="btn-sell">Sell</button>
            </div>
        </div>
    </div>

    <!-- 下方：文章專區區塊 (獨立卡片，位於股市下方) -->
    <div class="articles-container">
        <div class="articles-header">
            <h2>鬆餅文章專區</h2>
            <button id="btn-new-article" class="btn-primary">發佈文章</button>
        </div>

        <!-- 發佈文章表單 (預設隱藏) -->
        <div id="article-form-container" class="article-form" style="display: none;">
            <input type="text" id="article-title-input" placeholder="文章標題..." />
            <textarea id="article-content-input" rows="3" placeholder="撰寫您的文章內容..."></textarea>
            <div class="form-actions">
                <button id="btn-submit-article" class="btn-submit">發佈</button>
                <button id="btn-cancel-article" class="btn-alt">取消</button>
            </div>
        </div>

        <!-- 文章列表 -->
        <div id="articles-list" class="articles-list">
            <p class="empty-msg">載入文章中...</p>
        </div>
    </div>

    <!-- 會員登入 / 註冊彈出視窗 -->
    <div id="auth-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="close-modal" class="close">&times;</span>
            <h2>Member Login / Sign Up</h2>
            <form id="auth-form">
                <input type="email" id="auth-email" placeholder="Email" required />
                <input type="password" id="auth-password" placeholder="Password (min 6 characters)" required />
                <div class="modal-buttons">
                    <button type="submit" id="btn-login" class="btn-submit">Login</button>
                    <button type="button" id="btn-signup" class="btn-alt">Sign Up</button>
                </div>
            </form>
            <p id="auth-message" class="auth-msg"></p>
        </div>
    </div>

    <!-- 載入外部 JS 檔 -->
    <script src="articles.js"></script>
    <script src="stock.js"></script>
</body>
</html>
